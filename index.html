<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASM-CPT 学习中心 V2 · 预览版</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ef8a17'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#0f1626; --ink2:#16203a; --line:#25314d;
  --paper:#f4f5f8; --card:#ffffff; --bd:#e3e6ee; --tx:#232a3a; --mut:#6b7385;
  --org:#ef8a17; --org2:#f6a93d; --orgsoft:#fdf0dd;
  --green:#2f9e6e; --greensoft:#e4f5ec;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--paper);color:var(--tx);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

/* ===== Sidebar ===== */
.side{background:linear-gradient(180deg,var(--ink),var(--ink2));color:#dfe5f2;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .logo{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:var(--org);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:15px;line-height:1.3;color:#fff}
.brand small{display:block;font-size:11px;color:#94a0bd;font-weight:500;letter-spacing:.3px}
.progress-wrap{margin:14px 4px 18px}
.progress-wrap .pbar{height:7px;border-radius:6px;background:#223052;overflow:hidden}
.progress-wrap .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--org),var(--org2));border-radius:6px;transition:width .4s}
.progress-wrap .ptxt{font-size:11px;color:#9fabca;margin-top:6px;display:flex;justify-content:space-between}
.part{margin:14px 0 4px}
.part .pt-title{font-size:11px;letter-spacing:1px;color:#7e8bb0;text-transform:uppercase;padding:0 8px 6px;font-weight:700}
.chap{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:#c6cee0;padding:8px 9px;border-radius:8px;font-size:13px;cursor:pointer;line-height:1.3;transition:.15s}
.chap:hover{background:#1b2743;color:#fff}
.chap.active{background:var(--org);color:#fff;font-weight:600}
.chap .no{flex:0 0 auto;font-size:10px;font-weight:700;background:#223052;color:#aeb8d6;border-radius:5px;padding:2px 6px}
.chap.active .no{background:rgba(255,255,255,.25);color:#fff}
.chap .tt{flex:1}
.chap .dot{width:8px;height:8px;border-radius:50%;background:#33406a;flex:0 0 8px}
.chap.done .dot{background:var(--org2)}
.chap.active .dot{background:#fff}
.chap.locked{color:#7986a8}
.apx-title{margin:18px 8px 4px;font-size:11px;letter-spacing:1px;color:#7e8bb0;font-weight:700}

/* ===== Main ===== */
.main{padding:26px 30px 60px;max-width:980px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--mut)}
.crumb b{color:var(--org);font-weight:700}
.ch-head h2{font-size:24px;letter-spacing:-.3px;margin:6px 0 4px}
.ch-head .sub{font-size:13px;color:var(--mut)}
.tabs{display:inline-flex;background:#e9ecf3;border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

.hint-banner{display:flex;gap:10px;align-items:flex-start;background:var(--orgsoft);border:1px solid #f6dcb8;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5310;margin-bottom:18px;line-height:1.5}
.hint-banner svg{flex:0 0 18px;margin-top:1px}

/* objective cards (learn mode) */
.obj-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.obj-head{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--tx)}
.obj-head .idx{flex:0 0 26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.obj-head.mastered .idx{background:var(--green)}
.obj-head .otx{flex:1;font-size:14.5px;font-weight:600;line-height:1.5;padding-top:3px}
.obj-head .chev{flex:0 0 auto;transition:.25s;color:var(--mut);margin-top:3px}
.obj-card.open .obj-head .chev{transform:rotate(180deg)}
.obj-body{display:none;padding:0 16px 16px 54px}
.obj-card.open .obj-body{display:block}
.pts{list-style:none;margin-bottom:12px}
.pts li{position:relative;padding:7px 0 7px 20px;font-size:13.5px;line-height:1.6;color:#36405a;border-top:1px dashed #eef0f5}
.pts li:before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--org)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.kw{font-size:11.5px;background:#eef1f8;color:#42506e;border-radius:20px;padding:3px 10px;font-weight:600}
.analogy{font-size:12.5px;background:#f7f9fc;border-left:3px solid var(--org2);border-radius:0 8px 8px 0;padding:8px 12px;color:#526;font-style:italic;line-height:1.5}
.obj-foot{display:flex;justify-content:flex-end;margin-top:8px}
.mbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
.mbtn.on{background:var(--greensoft);border-color:#bfe6d2;color:var(--green)}

/* flash mode */
.flash{display:none}
.flash.on{display:block}
.flash-stage{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow);min-height:340px;display:flex;flex-direction:column}
.flash-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--mut)}
.flash-q{padding:30px 28px 16px;font-size:19px;font-weight:700;line-height:1.6;text-align:center}
.flash-a{padding:8px 28px 20px;display:none}
.flash.a .flash-a{display:block}
.flash.a .flash-q{padding-bottom:8px}
.flash-a ul{list-style:none;max-width:640px;margin:0 auto}
.flash-a li{position:relative;padding:9px 0 9px 22px;font-size:14px;line-height:1.6;color:#36405a;border-top:1px dashed #eef0f5}
.flash-a li:before{content:"";position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--org)}
.flash-tap{margin:auto 28px 16px;text-align:center;font-size:12.5px;color:var(--mut)}
.flash-actions{display:flex;gap:10px;justify-content:center;padding:0 20px 22px;flex-wrap:wrap}
.btn{border:0;border-radius:24px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.ghost{background:#eef1f6;color:var(--ink)}
.btn.primary{background:var(--org);color:#fff}
.btn.success{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

.menu-btn{display:none}.scrim{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;z-index:40;transform:translateX(-100%);transition:.25s}
  .side.open{transform:translateX(0)}
  .main{padding:18px 16px 50px}
  .menu-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;border:1px solid var(--bd);background:#fff;cursor:pointer}
  .scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:30}
  .scrim.on{display:block}
  .obj-body{padding-left:16px}
}
/* ===== 附录工具 ===== */
.ax-bar{background:#fff;border:1px solid #e4e8f2;border-radius:12px;padding:12px;margin-bottom:14px}
.ax-label{font-size:11px;font-weight:700;letter-spacing:1px;color:#8a93ad;margin:6px 2px 6px}
.ax-label:first-child{margin-top:0}
.ax-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d7dcea;background:#f6f7fb;color:#46506b;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:#ef8a17}
.chip.on{background:#ef8a17;border-color:#ef8a17;color:#fff;font-weight:600}
.ax-list{display:flex;flex-direction:column;gap:9px}
.ax-item{background:#fff;border:1px solid #e4e8f2;border-radius:11px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ax-name{font-size:14px;font-weight:600;color:#1a2236}
.ax-cue{grid-column:1/2;font-size:12.5px;color:#6b748c}
.ax-stages{grid-row:1/3;grid-column:2/3;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.stg{font-size:10.5px;font-weight:700;color:#b06a10;background:#fdeed9;border-radius:5px;min-width:19px;text-align:center;padding:2px 4px}
.ax-empty{color:#8a93ad;font-size:13px;padding:24px;text-align:center}
.ax-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.tab{border:1px solid #d7dcea;background:#fff;color:#46506b;border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer}
.tab.on{background:#16203a;border-color:#16203a;color:#fff;font-weight:600}
.b-name{font-size:15px;font-weight:700;color:#1a2236;margin:2px 0 9px}
.b-table{width:100%;border-collapse:collapse;background:#fff;border-radius:11px;overflow:hidden;border:1px solid #e4e8f2}
.b-table th,.b-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid #edf0f6;text-align:left;vertical-align:top}
.b-table th{width:22%;background:#f6f7fb;color:#5a637c;font-weight:700;white-space:nowrap}
.b-table tr:last-child th,.b-table tr:last-child td{border-bottom:none}
.calc-card{background:#fff;border:1px solid #e4e8f2;border-radius:12px;padding:16px;margin-bottom:13px}
.calc-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.calc-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.calc-field label{font-size:11.5px;font-weight:700;color:#8a93ad;letter-spacing:.5px}
.calc-input{border:1px solid #d3d9e8;border-radius:9px;padding:10px 12px;font-size:15px;color:#1a2236;background:#fafbfe}
.calc-input:focus{outline:none;border-color:#ef8a17;background:#fff}
.rm-out{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 4px}
.rm-box{border-radius:10px;padding:11px;text-align:center;background:#f6f7fb;border:1px solid #e4e8f2}
.rm-box.hl{background:#fff3e4;border-color:#f3c188}
.rm-box .lb{font-size:11px;color:#8a93ad;margin-bottom:3px}
.rm-box .vl{font-size:20px;font-weight:800;color:#1a2236}
.rm-box.hl .vl{color:#d97a0c}
.pct-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e4e8f2;border-radius:11px;overflow:hidden}
.pct-table th,.pct-table td{padding:7px 10px;font-size:12.5px;text-align:center;border-bottom:1px solid #edf0f6}
.pct-table th{background:#16203a;color:#fff;font-weight:700}
.pct-table td:first-child{color:#5a637c;font-weight:700;background:#fafbfe}
.formula-note{font-size:12px;color:#7b849c;line-height:1.7;margin-top:11px;background:#f6f7fb;border-radius:9px;padding:10px 12px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.d-card{perspective:1100px;cursor:pointer;height:172px}
.d-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.d-card.flip .d-inner{transform:rotateY(180deg)}
.d-front,.d-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:13px;border:1px solid #e4e8f2;display:flex;flex-direction:column}
.d-front{background:#fff;justify-content:center;align-items:center;gap:8px;text-align:center}
.d-fname{font-size:15.5px;font-weight:800;color:#1a2236}
.d-fgrp{font-size:11px;color:#b06a10;background:#fdeed9;border-radius:6px;padding:3px 9px}
.d-hint{font-size:10.5px;color:#9aa2b8;margin-top:4px}
.d-back{background:#16203a;color:#e8ebf4;transform:rotateY(180deg);overflow:auto;gap:5px}
.d-sec{font-size:11.5px;line-height:1.5}
.d-sec b{color:#f6a93d;display:block;font-size:10px;letter-spacing:.5px;margin-bottom:1px}
.eq-card{background:#fff;border:1px solid #e4e8f2;border-radius:13px;padding:18px;min-height:200px;display:flex;flex-direction:column}
.eq-progress{font-size:12px;color:#8a93ad;margin-bottom:12px;font-weight:600}
.eq-q{font-size:16px;font-weight:700;color:#1a2236;line-height:1.55}
.eq-a{margin-top:15px;padding:13px;border-radius:10px;background:#f3f8f4;border:1px solid #cfe6d8;color:#235039;font-size:13.5px;line-height:1.65;display:none}
.eq-a.on{display:block}
.eq-tap{margin-top:auto;font-size:11.5px;color:#9aa2b8;text-align:center;padding-top:14px}
.eq-nav{display:flex;gap:9px;margin-top:12px}
.eq-nav button{flex:1;border:1px solid #d7dcea;background:#fff;border-radius:9px;padding:10px;font-size:13px;font-weight:600;color:#46506b;cursor:pointer}
.eq-nav button.go{background:#ef8a17;border-color:#ef8a17;color:#fff}
.eq-nav button:disabled{opacity:.4;cursor:default}
@media(max-width:560px){.rm-out{grid-template-columns:1fr 1fr}.rm-box.hl{grid-column:1/3}.d-grid{grid-template-columns:1fr 1fr;gap:8px}.d-card{height:180px}}
/* ===== 语音朗读 TTS ===== */
.tts-fab{position:fixed;right:18px;bottom:18px;width:62px;height:62px;border-radius:50%;background:var(--org);color:#fff;border:0;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(239,138,23,.42);cursor:pointer;z-index:60;display:grid;place-items:center;line-height:1.15}
.tts-fab:active{background:#dc7d12}
.tts-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e6ee;box-shadow:0 -10px 32px rgba(16,24,40,.14);z-index:61;transform:translateY(112%);transition:transform .28s ease;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tts-bar.on{transform:translateY(0)}
.tts-btop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tts-btitle{font-size:13.5px;font-weight:700;color:#1a2236;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tts-count{font-size:12px;color:#8a93ad;font-weight:700}
.tts-x{border:0;background:#f1f3f8;color:#6b7385;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;flex:0 0 32px}
.tts-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tts-segs{display:flex;gap:7px;flex-wrap:wrap}
.tts-transport{display:flex;gap:10px;width:100%;justify-content:center;margin-top:3px}
.tts-seg{display:inline-flex;background:#eef1f7;border-radius:9px;padding:2px}
.tts-seg button{border:0;background:none;padding:8px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:#6b7385;cursor:pointer}
.tts-seg button.on{background:#fff;color:#1a2236;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.tts-cbtn{border:1px solid #dde2ee;background:#fff;color:#1a2236;border-radius:11px;width:48px;height:50px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.tts-cbtn:active{background:#f4f6fb}
.tts-cbtn svg{width:22px;height:22px}
.tts-play{width:60px;height:52px;background:var(--org);border-color:var(--org);color:#fff;border-radius:13px}
.tts-play.playing{background:var(--ink);border-color:var(--ink)}
.tts-play svg{width:26px;height:26px}
.tts-stop{color:#b04545}
.tts-spacer{flex:1}
.tts-note{font-size:11px;color:#9aa2b8;margin-top:9px;line-height:1.55;display:none}
.tts-note.on{display:block}
body.tts-on{padding-bottom:150px}
@media(max-width:560px){.tts-controls{gap:6px}.tts-cbtn{width:45px;height:48px}.tts-play{width:56px}.tts-seg button{padding:8px 9px;font-size:12px}}

/* V2 mobile additions */
.v2-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.v2-tools button,.v2-tools input{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px;font-size:13px}.v2-tools input{flex:1;min-width:160px}.v2-panel{background:white;border:1px solid var(--bd);padding:16px;border-radius:14px;margin:0 0 15px}.v2-panel h3{margin-bottom:10px}.v2-result{display:block;width:100%;padding:10px;text-align:left;background:#f6f7fb;border:0;border-radius:8px;margin:6px 0;color:#25314d}.v2-figure{max-width:100%;height:auto;border-radius:12px;background:#f7f9fc}.v2-tag{font-size:12px;color:#6b7385}.v2-hidden{display:none}.v2-status{font-size:12px;color:#57647d;margin-top:8px}button:focus-visible{outline:3px solid #ef8a17;outline-offset:2px}
@media(max-width:560px){.topbar{align-items:flex-start}.ch-head h2{font-size:20px}.v2-tools{gap:6px}.v2-tools button{flex:1}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">NASM</div>
      <h1>CPT 私人教练认证<small>第6版 · 章目标交互学习</small></h1>
    </div>
    <div class="progress-wrap">
      <div class="pbar"><i id="progBar"></i></div>
      <div class="ptxt"><span>已掌握目标</span><span id="progTxt">0 / 0</span></div>
    </div>
    <div id="nav"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn" aria-label="目录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#232a3a" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="crumb" id="crumb"></div>
          <div class="ch-head"><h2 id="chTitle"></h2><div class="sub" id="chSub"></div></div>
        </div>
      </div>
      <div class="tabs">
        <button id="tabLearn" class="on">学习模式</button>
        <button id="tabFlash">闪卡回忆</button>
      </div>
    </div>

    <div class="v2-tools" aria-label="学习工具">
<input id="v2Search" type="search" placeholder="搜索章节、知识点…" aria-label="搜索知识点"><button id="v2QuizBtn">自测</button><button id="v2VisualBtn">图解</button><button id="v2Export">备份</button><button id="v2Import">恢复</button><input id="v2ImportFile" type="file" accept="application/json,.json" hidden>
</div><div id="v2Panel" class="v2-panel v2-hidden"></div>
<div class="learn" id="learnView"></div>
    <div class="flash" id="flashView">
      <div class="flash-stage">
        <div class="flash-top"><span id="flashCount"></span><span id="flashState">先在脑中作答，再揭晓</span></div>
        <div class="flash-q" id="flashQ"></div>
        <div class="flash-a" id="flashA"></div>
        <div class="flash-tap" id="flashTap">点击下方「揭晓答案」核对</div>
        <div class="flash-actions">
          <button class="btn ghost" id="prevCard">上一张</button>
          <button class="btn primary" id="revealBtn">揭晓答案</button>
          <button class="btn success" id="masterCard">我已掌握</button>
          <button class="btn ghost" id="nextCard">下一张</button>
        </div>
      </div>
    </div>
  </main>
</div>

<button class="tts-fab" id="ttsFab" aria-label="朗读本页">

8:{objectives:[

  pts:["急性反应：心率、每搏输出量、心输出量、通气量、摄氧量增加，血流转向工作肌。","慢性适应：静息心率下降，每搏输出量与 VO2max 提高，毛细血管与线粒体增多，脂肪氧化增强。"],

 {o:"运用个性化方法针对不同客户设计和实施心肺功能训练计划。",

  kw:["个性化","类型选择","稳态/间歇","依从性"]},
 {o:"指导客户如何安全有效地进行心肺功能练习。",

9:{objectives:[
 {o:"理解核心肌群的重要性。",
  pts:["核心是上下肢力量传递的中枢（力量屋），含深层稳定肌（腹横肌、多裂肌、膈肌、盆底肌）与表层动作肌（腹直肌、竖脊肌、内外斜肌、腰方肌）。","核心提供稳定、对齐与发力基础，影响姿势、效率、下背健康与运动表现。"],
  kw:["力量屋","深层稳定肌","腹横肌/多裂肌","力量传递"],analogy:"核心像充满气的气缸，内部有压力才撑得住、不变形。"},
 {o:"了解稳定系统与动作系统间的区别。",
  pts:["局部（稳定）系统：深层、耐力型，做脊柱节段稳定（腹横肌、多裂肌、膈肌、盆底）。","整体（动作）系统：表层、力量型，产生躯干大范围动作（腹直肌、竖脊肌、内外斜肌、腰方肌）。","先有稳定，再发展动作与力量。"],

 {o:"论述核心训练的重要性。",

  kw:["下背损伤","神经肌肉控制","稳定","核心爆发"]},
 {o:"为任何训练层级的客户设计核心训练计划。",
  pts:["按 OPT 进阶：稳定（平板、桥、鸟狗、死虫）→ 力量（平板变体、卷腹、抗旋转、伐木）→ 爆发（药球旋转抛、快速屈伸）。","从简到繁、无痛，结合评估结果。"],

  kw:["平板/桥","中立脊柱","伐木","药球抛"]}
]},

  pts:["平衡是神经、视觉、前庭与本体感觉多系统整合的结果。","遵循特异性、循序渐进与超负荷，强调动作质量与无痛。"],

 {o:"探讨快速伸缩复合训练的重要性。",
  pts:["提升弹性能利用、神经反射速度与爆发力，增强减速缓冲能力、降低损伤风险。","是把力量转化为速度与爆发表现的关键环节。"],

13:{objectives:[

  kw:["SAID","超负荷","专项性","可逆性"]},
 {o:"定义稳定性、肌肉耐力、肌肉肥大、力量和爆发力。",

 {o:"列出并定义力量训练系统的各个阶段。",
  pts:["单组、多组（金字塔/倒金字塔：重量与次数递增或递减）。","超级组、复合组、巨人组、循环训练、间歇训练与分化训练。","按目标选择组数、次数、负荷、节奏与休息。"],
  kw:["金字塔","超级组","循环训练","分化训练"]}

17:{objectives:[

const ttsSynth=('speechSynthesis' in window)?window.speechSynthesis:null;

function ttsLoadVoices(){if(ttsSynth)ttsVoices=ttsSynth.getVoices();}

function pickVoice(sex){
 if(!ttsSynth)return null;
 const vs=ttsVoices.length?ttsVoices:ttsSynth.getVoices();
 const tw=vs.filter(v=>/zh[-_]tw/i.test(v.lang));
 const hant=vs.filter(v=>/zh[-_]hant/i.test(v.lang));
 const zh=vs.filter(v=>/^zh|cmn/i.test(v.lang));
 const fRe=/female|女|ting|hanana|mei|jia|xiao|ling|yue|google/i;
 const mRe=/male|男|tsu|zhi|gang/i;
 function inList(l){if(sex==='male')return l.find(v=>mRe.test(v.name))||null;return l.find(v=>fRe.test(v.name))||l[0]||null;}
 if(sex==='male')return inList(tw)||inList(hant)||inList(zh)||tw[0]||zh[0]||vs.find(v=>/^zh/i.test(v.lang))||null;
 return inList(tw)||inList(hant)||inList(zh)||vs.find(v=>/^zh/i.test(v.lang))||null;
}

function buildBItems(){return BPLAN.map(p=>({title:'阶段'+p.no+' '+p.nm,text:'O P T 阶段'+p.no+'，'+p.nm+'。目标：'+p.goal+'。组数'+p.sets+'，次数'+p.reps+'，节奏'+p.tempo+'，休息'+p.rest+'，强度'+p.load+'。热身：'+p.warm+'。核心：'+p.core+'。平衡：'+p.bal+'。反应：'+p.plyo+'。S A Q：'+p.saq+'。抗阻：'+p.res+'。要点：'+p.note+'。'}));}
function buildCItems(){
 const wEl=document.getElementById('cW'),rEl=document.getElementById('cR'),uEl=document.getElementById('cUnit');
 if(!wEl)return [{title:'单次最大估算',text:'请先打开附录C，输入重量和次数。'}];
 const w=parseFloat(wEl.value)||0,r=Math.min(10,Math.max(1,parseInt(rEl.value)||1)),u=uEl.value==='kg'?'公斤':'磅';
 const br=w*36/(37-r),ep=w*(1+r/30),avg=(br+ep)/2;
 return [{title:'单次最大估算',text:'重量'+w+u+'，能做'+r+'次。第一种公式估算'+br.toFixed(1)+'，第二种公式估算'+ep.toFixed(1)+'，平均单次最大约'+avg.toFixed(1)+u+'。'}];
}

function ttsUI(){
 const N=ttsItems.length;
 document.getElementById('ttsCount').textContent=N?(Math.min(ttsIdx+1,N)+' / '+N):'';
 const active=ttsPlaying&&!ttsPaused,pb=document.getElementById('ttsPlay');
 pb.classList.toggle('playing',active);
 pb.innerHTML=active?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function speakIdx(){
 if(!ttsSynth)return;
 if(ttsIdx>=ttsItems.length){ttsEndAll();return;}
 const my=++ttsToken;
 ttsSynth.cancel();
 setTimeout(()=>{
   if(my!==ttsToken)return;
   const it=ttsItems[ttsIdx],u=new SpeechSynthesisUtterance(it.text),v=pickVoice(ttsSex);
   if(v){u.voice=v;u.lang=v.lang;}else u.lang='zh-TW';
   u.rate=ttsRate;u.pitch=1.06;
   u.onend=()=>{if(my!==ttsToken)return;if(ttsPlaying){ttsIdx++;ttsUI();speakIdx();}};
   u.onerror=()=>{if(my!==ttsToken)return;};
   ttsSynth.speak(u);
 },130);
 ttsPlaying=true;ttsPaused=false;ttsUI();
}
function ttsToggle(){
 if(!ttsSynth){ttsNote('此浏览器不支持语音朗读，建议用系统自带浏览器或 Chrome。');return;}
 if(ttsPlaying&&!ttsPaused){ttsSynth.pause();ttsPaused=true;ttsUI();}
 else if(ttsPaused){ttsSynth.resume();ttsPaused=false;ttsUI();}
 else {ttsRefresh();ttsIdx=0;ttsUI();speakIdx();ttsCheckNote();}
}
function ttsStop(){ttsToken++;ttsPlaying=false;ttsPaused=false;if(ttsSynth)ttsSynth.cancel();ttsUI();}
function ttsEndAll(){ttsPlaying=false;ttsPaused=false;ttsUI();}
function ttsPrev(){if(ttsIdx>0){ttsIdx--;ttsUI();if(ttsPlaying)speakIdx();}}

function ttsCheckNote(){
 const v=pickVoice(ttsSex),el=document.getElementById('ttsNote');let msg='';
 if(!v)msg='没有找到中文语音：请在 系统设置 → 辅助功能/语言与输入 下载「中文(台灣)」语音后再点播放。';
 else if(!/zh[-_]tw/i.test(v.lang))msg='未找到台灣腔，当前用「'+v.name+'」；可在系统语音设置下载「中文(台灣)」。';
 else if(ttsSex==='male'&&!/male|男|tsu/i.test(v.name))msg='系统里可能没有台灣男声，已用「'+v.name+'」；可在系统语音设置下载男声。';
 el.textContent=msg;el.classList.toggle('on',!!msg);
}
